<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Madinaverify</title><link rel="stylesheet" href="/auth.css"></head><body><main class="auth"><div class="card"><div class="brand"><span class="mark">✓</span>Madina<span>verify</span></div><p class="subtitle">Admin Login</p><div id="msg" class="msg"></div><label>Username or Email</label><input id="id"><label>Password</label><input id="pw" type="password"><button class="btn" onclick="go()">Login</button></div></main><script>async function go(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:id.value,password:pw.value})});const x=await r.json();if(!r.ok){msg.textContent=x.error;msg.style.display='block';return}location='/admin/dashboard'}</script></body></html>
