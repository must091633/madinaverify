<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Madinaverify</title><link rel="stylesheet" href="styles.css"><style>
.dashboard{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#0c1c29;color:#d9e4ed;padding:24px;display:flex;flex-direction:column}.side-links{display:grid;gap:5px;margin-top:35px}.side-links a{padding:11px 12px;border-radius:9px;color:#b9c9d6}.side-links a:hover,.side-links a.active{background:#163447;color:#fff}.logout{margin-top:auto;background:none;border:1px solid #385063;color:#d9e4ed;padding:10px;border-radius:9px}.main{padding:34px 5%;overflow:auto}.dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:#fff;border:1px solid var(--line);padding:20px;border-radius:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;margin-top:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:13px}.badge{padding:4px 8px;border-radius:99px;background:#e9f7f2;color:var(--brand);font-size:11px}.api-key{font-family:ui-monospace;font-size:12px;background:#f1f4f7;padding:8px;border-radius:7px}.sidebar .brand{color:#fff}.empty{color:var(--muted);padding:30px;text-align:center}@media(max-width:800px){.dashboard{grid-template-columns:1fr}.sidebar{position:relative}.side-links{display:flex;overflow:auto}.cards{grid-template-columns:1fr 1fr}}
</style></head><body><div class="dashboard"><aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">M</span>Madinaverify</a><div class="side-links"><a class="active" href="dashboard.html">Overview</a><a href="docs.html">API Docs</a><a href="dashboard.html#keys">API Keys</a><a href="dashboard.html#activity">Activity</a><a href="dashboard.html#profile">Profile</a></div><button class="logout" onclick="logout()">Sign out</button></aside><main class="main"><div class="dash-head"><div><span class="eyebrow">BUSINESS CONSOLE</span><h2 id="welcome">Dashboard</h2></div><a class="btn" href="docs.html">Developer docs</a></div><div class="cards"><div class="stat"><small>API requests</small><strong id="requests">—</strong></div><div class="stat"><small>Successful</small><strong id="success">—</strong></div><div class="stat"><small>API keys</small><strong id="keysCount">—</strong></div><div class="stat"><small>Balance</small><strong id="balance">₦0</strong></div></div><div class="panel" id="keys"><h3>API keys</h3><p class="muted">Create and revoke credentials for your server-side integrations.</p><button class="btn" id="createKey">Create API key</button><div id="keyList"></div></div><div class="panel" id="activity"><h3>Recent activity</h3><div id="activityList" class="empty">Loading…</div></div></main></div><script src="config.js"></script><script src="app.js"></script><script>
async function logout(){await api("/auth/logout",{method:"POST"});location.href="index.html"}
async function load(){try{const r=await api("/me");welcome.textContent="Good to see you, "+r.user.name;requests.textContent=r.stats.requests;success.textContent=r.stats.successRate+"%";keysCount.textContent=r.stats.keys;balance.textContent=money(r.stats.balance);keyList.innerHTML=r.keys.length?r.keys.map(k=>'<div class="panel" style="margin-top:12px"><b>'+k.name+'</b><div class="api-key">'+k.prefix+'••••••••</div><small class="muted">Created '+new Date(k.createdAt).toLocaleDateString()+'</small></div>').join(""):"<div class='empty'>No API keys yet.</div>";activityList.innerHTML=r.activity.length?'<table class="table"><tr><th>Type</th><th>Status</th><th>Date</th></tr>'+r.activity.map(a=>'<tr><td>'+a.type+'</td><td><span class="badge">'+a.status+'</span></td><td>'+new Date(a.createdAt).toLocaleString()+'</td></tr>').join("")+'</table>':"<div class='empty'>No activity yet.</div>"}catch(e){location.href="login.html"}}
createKey.onclick=async()=>{try{const r=await api("/keys",{method:"POST",body:JSON.stringify({name:"Production key"})});alert("Copy this API key now. It will not be shown again:\\n\\n"+r.apiKey);load()}catch(e){alert(e.message)}};load();
</script></body></html>
