<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Madinaverify</title><link rel="stylesheet" href="styles.css"><style>.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#123c36 0,#07110f 38%,#050706 100%);color:#fff}.auth-card{width:min(460px,94vw);background:rgba(24,28,27,.96);padding:34px;border:1px solid rgba(0,255,200,.12);border-radius:20px;box-shadow:0 20px 70px rgba(0,255,200,.12)}.brand{display:inline-flex;align-items:center;gap:10px;color:#00f0c0;font-weight:800;text-decoration:none}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:2px solid #00f0c0;border-radius:10px}.auth-card h1{font-size:34px;margin:34px 0 4px;color:#00f0c0}.muted{color:#a9b7b3}.auth-card form{display:grid;gap:16px;margin:25px 0}.auth-card label{font-weight:700;font-size:14px;color:#00e9bb}.auth-card input{box-sizing:border-box;display:block;width:100%;margin-top:8px;padding:14px;background:#151a18;border:1px solid #3d4b47;color:#fff;border-radius:10px;font:inherit;outline:none}.auth-card input:focus{border-color:#00e9bb;box-shadow:0 0 0 3px rgba(0,233,187,.1)}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#00e9bb;color:#03110d;font-weight:800;font-size:16px;cursor:pointer}.error{color:#ff8c8c;min-height:20px}.links{display:flex;justify-content:space-between;gap:12px}.link{color:#00e9bb;font-weight:700;text-decoration:none}</style></head><body class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">M</span>Madinaverify</a><h1>Login</h1><p class="muted">Sign in to your Madinaverify account.</p><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" id="submit" type="submit">SIGN IN</button><p id="msg" class="error"></p></form><div class="links"><a class="link" href="forgot.html">Forgot Password?</a><a class="link" href="register.html">Sign Up</a></div></div><script src="config.js"></script><script src="app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent="";submit.disabled=true;submit.textContent="Signing in…";try{const r=await api("/auth/login",{method:"POST",body:JSON.stringify({email:email.value.trim(),password:password.value})});location.href=r.user.role==="admin"?"admin.html":"dashboard.html"}catch(x){msg.textContent=x.message}finally{submit.disabled=false;submit.textContent="SIGN IN"}};</script></body></html>
