<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTP | Madinaverify</title><link rel="stylesheet" href="/auth.css"></head><body><main class="auth"><div class="card"><div class="brand"><span class="mark">✓</span>Madina<span>verify</span></div><h2 class="center">Enter OTP Code</h2><p class="subtitle">We've sent a 6-digit verification code to <b id="email"></b></p><div id="msg" class="msg"></div><div class="otp">${[1,2,3,4,5,6].map(i=>`<input maxlength="1" inputmode="numeric" id="o${i}">`).join('')}</div><p class="center small">Code expires in <span class="timer" id="timer">05:00</span></p><button class="btn" id="verify">Verify Code</button><p class="center"><a href="#" class="link" id="resend">Resend Code</a> &nbsp; • &nbsp; <a href="/login.html" class="link">Change Email</a></p></div></main><script src="/auth.js"></script><script>initOtp()</script></body></html>
