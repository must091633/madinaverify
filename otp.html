<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify OTP — Madinaverify</title><link rel="stylesheet" href="styles.css"><style>.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:#07100e;color:#fff}.auth-card{width:min(430px,94vw);background:#171d1b;padding:34px;border-radius:20px;border:1px solid #25453e}.brand{color:#00e9bb;font-weight:800;text-decoration:none}.auth-card h1{color:#00e9bb;margin-top:30px}.muted{color:#a9b7b3}.auth-card form{display:grid;gap:16px;margin-top:25px}.auth-card input{width:100%;box-sizing:border-box;padding:15px;text-align:center;letter-spacing:8px;font-size:24px;background:#0e1412;border:1px solid #40504b;color:#fff;border-radius:10px}.btn{padding:14px;border:0;border-radius:10px;background:#00e9bb;font-weight:800}.error{color:#ff8c8c;min-height:20px}.link{color:#00e9bb}</style></head><body class="auth-page"><div class="auth-card"><a class="brand" href="login.html">Madinaverify</a><h1>Verify OTP</h1><p class="muted">Enter the 6-digit code sent to <b id="emailText"></b>.</p><form id="form"><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button class="btn" id="submit">VERIFY & CONTINUE</button><p id="msg" class="error"></p></form><p><a class="link" href="register.html">Use another email</a></p></div><script src="config.js"></script><script src="app.js"></script><script>const email=sessionStorage.getItem("mv_otp_email")||"";emailText.textContent=email||"your email";form.onsubmit=async e=>{e.preventDefault();msg.textContent="";try{await api("/auth/verify-otp",{method:"POST",body:JSON.stringify({email,otp:otp.value})});sessionStorage.removeItem("mv_otp_email");sessionStorage.removeItem("mv_dev_otp");location.href="dashboard.html"}catch(x){msg.textContent=x.message}};</script></body></html>
